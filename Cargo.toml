[package]
name = "urlmd"
version = "0.1.3"
edition = "2024"
description = "Fetch a web page as Markdown, preferring native Markdown when available"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
dom_query = { version = "0.27.0", default-features = false }
encoding_rs = "0.8.41"
htmd = "0.5.5"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
url = "2.5"

[profile.release]
strip = true
lto = "thin"
